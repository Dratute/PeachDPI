name: Build PeachDPI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "=== ROOT ==="
          pwd
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \)

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo "ERROR: settings.gradle(.kts) is missing from repository root"
            exit 1
          fi
          gradle --no-daemon assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PeachDPI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
