name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build ByeDPI core
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          git clone --depth 1 https://github.com/hufrea/byedpi.git /tmp/byedpi
          echo "ByeDPI commit: $(git -C /tmp/byedpi rev-parse HEAD)"
          build() {
            mkdir -p "app/src/main/jniLibs/$1"
            "$TC/$2" -D_DEFAULT_SOURCE -I/tmp/byedpi -std=c99 -O2 -pie \
              /tmp/byedpi/packets.c /tmp/byedpi/main.c /tmp/byedpi/conev.c \
              /tmp/byedpi/proxy.c /tmp/byedpi/desync.c /tmp/byedpi/mpool.c \
              /tmp/byedpi/extend.c \
              -o "app/src/main/jniLibs/$1/libciadpi.so"
          }
          build arm64-v8a aarch64-linux-android26-clang
          build armeabi-v7a armv7a-linux-androideabi26-clang
          build x86_64 x86_64-linux-android26-clang

      - name: Build tun2socks
        run: |
          NDK="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          mkdir -p /tmp/hev
          git clone --recursive --depth 1 --shallow-submodules \
            https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev/jni
          echo "hev commit: $(git -C /tmp/hev/jni rev-parse HEAD)"
          cd /tmp/hev
          "$NDK/ndk-build" -j4
          cp -r /tmp/hev/libs/* "$GITHUB_WORKSPACE/app/src/main/jniLibs/"
          rm -rf "$GITHUB_WORKSPACE/app/src/main/jniLibs/x86"

      - name: Check native files
        run: |
          ls -la app/src/main/jniLibs/*
          test -f app/src/main/jniLibs/arm64-v8a/libciadpi.so
          test -f app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle assembleDebug --stacktrace

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PeachDPI.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PeachDPI.apk \
            --target "$GITHUB_SHA" \
            --title "PeachDPI (последняя сборка)" \
            --notes "Автоматическая сборка. Коммит: $GITHUB_SHA" \
            --latest
