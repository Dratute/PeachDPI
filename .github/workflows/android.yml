name: Build PeachDPI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build placeholder
        run: |
          echo "PeachDPI Android project is not ready yet."
          mkdir -p output
          echo "Native DPI engine not implemented" > output/STATUS.txt

      - name: Upload status
        uses: actions/upload-artifact@v4
        with:
          name: PeachDPI-status
          path: output/STATUS.txt
